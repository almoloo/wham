allowBuilds:
  bufferutil: false
  keccak: false
  unrs-resolver: true
  utf-8-validate: false

# @coinbase/cdp-sdk >= 1.53.0 dynamic-imports optional @x402/* peers that we
# don't install; Turbopack and webpack both hard-fail on the unresolved
# specifiers. It arrives via wagmi -> @wagmi/connectors -> @base-org/account
# (range ^1.0.0). 1.52.0 is the last release without them. Drop this override
# once cdp-sdk stops failing the build.
overrides:
  "@coinbase/cdp-sdk": "1.52.0"
