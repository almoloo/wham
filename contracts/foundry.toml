# Spec §3 toolchain block, extended with RPC/verification config for the two
# target chains (421614 live until judging, 42161 present but unused).
[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
# settlement is stack-heavy; without IR expect stack-too-deep
via_ir = true
evm_version = "cancun"
# The deploy script writes ../shared/deployments/<chainId>.json and SeedDemo
# reads it back. Spec §3 only granted read on ./deployments, which contradicts
# §13.2, so the spec fragment is widened here.
fs_permissions = [{ access = "read-write", path = "../shared/deployments" }]

[profile.default.fuzz]
runs = 1024

[profile.ci.invariant]
runs = 256
depth = 64

[fmt]
line_length = 120
number_underscore = "thousands"

[rpc_endpoints]
anvil = "http://127.0.0.1:8545"
arbitrum_sepolia = "${ARB_SEPOLIA_RPC}"

[etherscan]
arbitrum_sepolia = { key = "${ARBISCAN_API_KEY}", chain = 421614 }
arbitrum = { key = "${ARBISCAN_API_KEY}", chain = 42161 }
